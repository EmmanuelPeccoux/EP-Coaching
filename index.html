<!DOCTYPE html>

<head>

  <!-- TODO: mettre à jour og:url si un domaine personnalisé est configuré (CNAME, prompt 1) -->

  <!-- Favicon — placeholder carré rouge + "EP" en attendant le vrai logo -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <!-- Préconnexions — CDN des libs + Google Fonts (Montserrat/Playfair Display) -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Playfair+Display:ital,wght@1,700&display=swap" />

  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/home.css" />

  <!-- CDN — chargées ici en préparation des prompts suivants (animations).
       defer partout (y compris les scripts locaux) pour ne pas bloquer le
       rendu : l'ordre relatif est conservé entre scripts deferred, donc la
       chaîne de dépendance GSAP → ScrollTrigger → Lenis → lenis-init.js →
       main.js reste garantie. -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.14/dist/lenis.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js" defer></script>
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════════════
       1. HEADER — logo EP Coaching
       ═══════════════════════════════════════════════════════════════ -->
  <header>
    <a href="./" class="logo">EP COACHING<!-- TODO: remplacer par le vrai logo PNG --></a>
    <!-- Diamant signature sous le wordmark, comme sur l'ancien logo EP. -->
    <span class="diamond logo-mark" aria-hidden="true"></span>
  </header>

  <main>

    <!-- ═══════════════════════════════════════════════════════════════
         2. HERO VSL — emplacement vidéo de vente (YouTube unlisted à venir)
         ═══════════════════════════════════════════════════════════════ -->
    <section class="hero-vsl">
      <!-- Diamant géant en filigrane, voir home.css pour la justification
           de ce choix (motif signature à l'échelle architecturale). -->
      <div class="hero-diamond-ghost" aria-hidden="true"></div>

      <p class="eyebrow"><!-- TODO: copy définitive -->◆ Coaching sportif &amp; business</p>

      <!-- TODO: copy finale — texte de calibrage pour dimensionner le H1 -->
      <h1>Ce que tu deviens ne doit rien au hasard</h1>

      <!-- TODO: remplacer par l'iframe YouTube unlisted réelle. Pas de
           role="button" tant qu'aucun clic ne fait quoi que ce soit :
           un faux affordance interactif serait pire que pas d'affordance
           du tout pour un lecteur d'écran. -->
      <div class="vsl-placeholder" aria-label="Emplacement de la vidéo de présentation">
        <span class="vsl-play" aria-hidden="true"></span>
      </div>
    </section>

    <!-- ═══════════════════════════════════════════════════════════════
         3. BIFURCATION — 2 blocs cliquables vers /physique/ et /business/
         ═══════════════════════════════════════════════════════════════ -->
    <section class="bifurcation">
      <div class="section-divider" aria-hidden="true"><span class="diamond"></span></div>
      <h2><!-- TODO: copy -->Choisis ton chemin</h2>
      <div class="blocs">
        <a href="physique/" class="bloc bloc-physique">
          <span class="diamond diamond--outline" aria-hidden="true"></span>
          <!-- TODO: copy finale -->
          <span class="bloc-label">Progresser en musculation</span>
        </a>
        <a href="business/" class="bloc bloc-business">
          <span class="diamond diamond--outline" aria-hidden="true"></span>
          <!-- TODO: copy finale -->
          <span class="bloc-label">Scaler mon business de coach</span>
        </a>
      </div>
    </section>

  </main>

  <!-- ═══════════════════════════════════════════════════════════════
       FOOTER — commun aux 3 pages
       ═══════════════════════════════════════════════════════════════ -->
  <footer>
    <p class="footer-brand">EP Coaching</p>
    <nav class="footer-legal" aria-label="Liens légaux">
      <a href="https://ep-coaching.vercel.app/legal/cgu" target="_blank" rel="noopener noreferrer">CGU</a>

  <script src="assets/js/lenis-init.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</body>
